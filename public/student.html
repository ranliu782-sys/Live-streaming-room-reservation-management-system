                let rejectHint = ''; if (b.is_score_timeout) rejectHint = `<div class="desc" style="color:#f87171;font-size:12px;font-weight:600;margin-top:6px;">⚠️ ${T('scoreTimeoutHint')}</div>`; else if (b.confirm_status === 'rejected' && !b.netdisk_url) rejectHint = `<div class="desc" style="color:#f87171;font-size:12px;margin-top:6px;">⚠️ ${T('rejectedHint')}</div>`;
                const noSubmitHint = isNoSubmitTimeout ? `<div class="desc" style="color:#f87171;font-size:12px;font-weight:600;margin-top:6px;">⚠️ ${T('noSubmitTimeoutHint')}</div>` : '';
                const isLeader = b.student_no === user.id;

                // 注意这里！我在标题里加上了数据库的真实 ID，方便你核对！
                div.innerHTML = `
                    <div class="title" style="color:#60a5fa;">【真实数据库 ID: ${b.id}】 ${T('room')} ${b.room || ''} · ${dateStr} ${stStr}-${etStr} ${tag} ${!isLeader ? '<span style="background:rgba(245,158,11,0.2); color:#fcd34d; border:1px solid rgba(245,158,11,0.4); padding:2px 8px; border-radius:10px; font-size:11px; margin-left:8px;">👥 组员邀请</span>' : ''}</div>
                    <div class="desc"><b>${T('course')}：</b>${escapeHtml(b.course || '')} (组长: ${escapeHtml(b.student_name)})</div>
                    <div class="desc"><b>${T('members')}：</b></div>${memberLines}${remainHtml}${preStatusHtml}${rejectHint}${noSubmitHint}
                    ${showNetdiskRow ? `<div class="desc" style="word-break:break-all; margin-top:10px; background:rgba(0,0,0,0.2); padding:8px; border-radius:6px;"><b>${T('netdisk')}：</b>${b.netdisk_url ? '<a href="' + escapeHtml(b.netdisk_url) + '" target="_blank" style="color:#60a5fa; text-decoration:none;">' + escapeHtml(b.netdisk_url) + '</a>' : '<span style="color:#64748b">' + T('notSubmitted') + '</span>'}</div>` : ''}${liveHint}
                    <div class="actions">
                        ${isLeader ? `${canCancel ? `<button class="sm gray" onclick="cancelBooking(${b.id})">${T('cancelBooking')}</button>` : ''}${canUpload ? `<button class="sm" onclick="openUploadModal(${b.id})">${T('submitNetdisk')}</button>` : ''}${canApplyPre ? `<button class="sm orange" onclick="openPreApplyModal(${b.id})">${preRejected ? T('preReApply') : T('preApplyBtn')}</button>` : ''}` : `<div style="font-size:13px;color:#94a3b8;padding:4px 0;">您是小组成员，由组长 <b>${escapeHtml(b.student_name)}</b> 负责管理此预约和提交网盘。</div>`}
                    </div>`;
                wrap.appendChild(div);
            } catch (err) {}
        });
    }

    async function cancelBooking(bookingId) { if (!confirm(T('confirmCancel'))) return; const res = await fetch('/api/booking/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bookingId, userId: user.id }) }); const data = await res.json(); if (!res.ok) { showToast(data.message || '取消失败', true); return; } showToast(T('cancelled'), false); loadMyBookings(); loadBoard(); }
    function openUploadModal(bookingId) { const html = `<div class="modal" id="uploadModal"><div class="box"><h3>${T('submitNetdisk')}</h3><div class="field"><label>${T('netdisk')}</label><input id="uploadUrl" placeholder="https://pan.baidu.com/s/xxxx"></div><div class="modal-actions"><button class="sm gray" onclick="document.getElementById('uploadModal').remove()">${T('cancel')}</button><button class="sm" onclick="doUpload(${bookingId})">${T('submit')}</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend', html); }
    async function doUpload(bookingId) { const url = document.getElementById('uploadUrl').value.trim(); if (!url) { showToast(T('pleaseInputLink'), true); return; } const res = await fetch('/api/booking/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bookingId, userId: user.id, netdiskUrl: url }) }); const data = await res.json(); if (!res.ok) { showToast(data.message || '提交失败', true); return; } showToast(data.message || T('uploadSuccess'), false); document.getElementById('uploadModal').remove(); await loadRestriction(); loadMyBookings(); }
    function openPreApplyModal(bookingId) { const html = `<div class="modal" id="preApplyModal"><div class="box"><h3>${T('preApplyTitle')}</h3><div class="field"><label>${T('preApplyReason')} <span style="color:#dc2626">*</span></label><textarea id="preReason" placeholder="${T('preApplyPlaceholder')}"></textarea></div><div class="modal-actions"><button class="sm gray" onclick="document.getElementById('preApplyModal').remove()">${T('cancel')}</button><button class="sm" onclick="submitPreApply(${bookingId})">${T('preApplySubmit')}</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend', html); }
    async function submitPreApply(bookingId) { const reason = document.getElementById('preReason').value.trim(); if (!reason) { showToast(T('preApplyReason') + '不能为空', true); return; } const res = await fetch('/api/booking/pre-submit-apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bookingId, userId: user.id, reason }) }); const data = await res.json(); if (!res.ok) { showToast(data.message || '提交失败', true); return; } showToast(T('preApplySuccess'), false); document.getElementById('preApplyModal').remove(); loadMyBookings(); }

    function checkMustChangePassword() { if (user && user.mustChangePassword) showChangePasswordModal(); }
    function showChangePasswordModal() { const html = `<div class="modal" id="cpModal"><div class="box"><h3>${T('cpTitle')}</h3><p style="font-size:13px;color:#94a3b8;margin-bottom:14px">${T('cpHint')}</p><div class="field"><label>${T('cpOld')}</label><input id="cpOld" type="password"></div><div class="field"><label>${T('cpNew')}</label><input id="cpNew" type="password"></div><div class="field"><label>${T('cpConfirm')}</label><input id="cpConfirm" type="password"></div><div class="modal-actions"><button class="sm gray" onclick="document.getElementById('cpModal').remove()">${T('cancel')}</button><button class="sm" onclick="submitChangePassword()">${T('cpSubmit')}</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend', html); }
    async function submitChangePassword() { const oldPwd = document.getElementById('cpOld').value; const newPwd = document.getElementById('cpNew').value; const cfmPwd = document.getElementById('cpConfirm').value; if (!oldPwd || !newPwd || !cfmPwd) { showToast(T('cpFillAll'), true); return; } if (newPwd !== cfmPwd) { showToast(T('cpMismatch'), true); return; } if (newPwd.length < 6) { showToast(T('cpTooShort'), true); return; } const res = await fetch('/api/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd }) }); const data = await res.json(); if (!res.ok) { showToast(data.message || '修改失败', true); return; } showToast(T('cpSuccess'), false); document.getElementById('cpModal').remove(); user.mustChangePassword = false; }

    function checkImpersonating(imp) { if (!imp || !imp.byAdmin) return; const old = document.getElementById('impersonateBar'); if (old) old.remove(); const div = document.createElement('div'); div.id = 'impersonateBar'; div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fbbf24;color:#78350f;padding:10px;z-index:99999;display:flex;justify-content:space-between;align-items:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15);gap:10px;flex-wrap:wrap'; div.innerHTML = `<span>⚠️ 测试模式：<b>${user.name}</b></span><div style="display:flex;gap:8px"><button onclick="openImpersonatePicker()" style="padding:4px 10px;background:#1e3a8a;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">切换</button><button onclick="restoreAdmin()" style="padding:4px 10px;background:#78350f;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">返回</button></div>`; document.body.appendChild(div); }
    async function restoreAdmin() { const res = await fetch('/api/admin/restore', { method: 'POST' }); const data = await res.json(); if (!res.ok) { alert(data.message); return; } location.href = data.redirect + '?t=' + Date.now(); }
    async function openImpersonatePicker() { const old = document.getElementById('impersonatePickerModal'); if (old) old.remove(); const res = await fetch('/api/admin/test-accounts'); if (!res.ok) { alert('无法加载'); return; } const data = await res.json(); const a = data.accounts; function makeOptions(list, role, roleLabel) { if (!list || list.length === 0) return ''; return `<optgroup label="${roleLabel}">` + list.map(u => `<option value="${role}|${u.id}">${u.name || ''}（${u.id}）</option>`).join('') + `</optgroup>`; } const html = `<div class="modal" id="impersonatePickerModal" style="z-index:100000"><div class="box"><h3>切换测试身份</h3><div class="field"><label>选择账户</label><select id="impersonateSelect" style="width:100%;padding:10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-size:16px;background:rgba(0,0,0,0.4);color:#fff;">${makeOptions(a.students, 'student', '👨‍🎓 学生')}${makeOptions(a.teachers, 'teacher', '👨‍🏫 教师')}${makeOptions(a.directors, 'director', '📋 主任')}${makeOptions(a.deans, 'dean', '🏛️ 三级院长')}</select></div><div class="modal-actions"><button class="sm gray" onclick="document.getElementById('impersonatePickerModal').remove()">取消</button><button class="sm" onclick="doImpersonateSwitch()">切换</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend', html); }
    async function doImpersonateSwitch() { const val = document.getElementById('impersonateSelect').value; if (!val) return; const [targetRole, targetId] = val.split('|'); const res = await fetch('/api/admin/impersonate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ targetRole, targetId }) }); const data = await res.json(); if (!res.ok) { alert(data.message); return; } setTimeout(() => { location.href = data.redirect + '?t=' + Date.now(); }, 800); }
    async function loadRandomQuote() { try { const res = await fetch('/api/quotes/random?t=' + Date.now()); const data = await res.json(); if (data.code === 'OK' && data.quote) { const box = document.getElementById('quoteBanner'); box.style.display = 'block'; document.getElementById('quoteContentInner').innerText = data.quote.content; document.getElementById('quoteAuthorInner').innerText = data.quote.author; } } catch (e) {} } loadRandomQuote();
    const innerEventSource = new EventSource('/api/quotes/stream'); innerEventSource.onmessage = (event) => { if (event.data === 'refresh') loadRandomQuote(); }; window.addEventListener('beforeunload', () => { innerEventSource.close(); });

    (async () => {
        const meRes = await fetch('/api/me?t=' + Date.now());
        if (!meRes.ok) { location.replace('/?timeout=1'); return; }
        const meData = await meRes.json();
        user = meData.user;
        checkImpersonating(meData.impersonating);
        if (user.role !== 'student') {
            if (!sessionStorage.getItem('retry_redirect_student')) {
                sessionStorage.setItem('retry_redirect_student', '1');
                setTimeout(() => { location.reload(); }, 600);
            } else {
                sessionStorage.removeItem('retry_redirect_student');
                location.replace('/?timeout=1');
            }
            return;
        }
        sessionStorage.removeItem('retry_redirect_student');
        document.getElementById('userInfo').innerText = user.name + ' · ' + user.college + ' · ' + user.id;
        applyI18N();
        await loadCourses();
        await loadBoard();
        checkMustChangePassword();
        await loadRestriction();
        // 进入页面时若存在逾期未提交或教师催交，自动弹窗提示（首次改密弹窗优先，避免叠加）
        if ((restriction.restricted || restriction.reminders.length) && !(user && user.mustChangePassword)) showRestrictModal();

        try {
            const checkRes = await fetch('/api/booking/my?userId=' + encodeURIComponent(user.id));
            const checkData = await checkRes.json();
            const hasInvites = checkData.bookings?.some(b => b.student_no !== user.id && b.booking_status === 'booked');
            if (hasInvites) {
                const myTab = document.getElementById('t-tabMy');
                if (myTab && !myTab.innerHTML.includes('🔴')) {
                    myTab.innerHTML += ' 🔴';
                }
            }
        } catch (e) {}

        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.remove();
    })();
    setInterval(() => { if (!user || document.hidden) return; const activeTab = document.querySelector('.tabs button.on'); if (activeTab && activeTab.dataset.tab === 'board') { loadBoard(); loadRestriction(); } }, 60000);
</script>

<!-- ===== 联系管理员（点击复制邮箱） ===== -->
<style>
  #caFab { position: fixed; right: 12px; bottom: 12px; z-index: 9000; background: rgba(30,41,59,.94); color: #e2e8f0;
           border: 1px solid rgba(148,163,184,.45); border-radius: 999px; padding: 8px 13px; font-size: 12px; line-height: 1;
           cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-family: inherit; }
  #caFab:active { transform: scale(.97); }
  #caMask { position: fixed; inset: 0; background: rgba(0,0,0,.65); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
            z-index: 99998; display: none; align-items: center; justify-content: center; padding: 16px; }
  #caBox { width: 100%; max-width: 380px; background: #1b1130; border: 1px solid rgba(255,255,255,.18); border-radius: 14px;
           padding: 20px; color: #e2e8f0; box-shadow: 0 20px 50px rgba(0,0,0,.55); }
  #caBox h3 { font-size: 16px; margin: 0 0 12px; color: #f8fafc; }
  #caMailBtn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px;
               background: rgba(59,130,246,.14); border: 1px solid rgba(59,130,246,.5); border-radius: 10px; color: #93c5fd;
               font-size: 14px; cursor: pointer; font-family: inherit; }
  #caMailBtn.copied { border-color: #34d399; background: rgba(52,211,153,.14); }
  #caCopyTip { font-size: 11px; color: #cbd5e1; background: rgba(255,255,255,.12); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  #caBox .ca-note { font-size: 12px; line-height: 1.7; color: #94a3b8; margin-top: 10px; }
  #caBox .ca-note b { color: #e2e8f0; }
  #caBox .ca-close { width: 100%; margin-top: 14px; padding: 9px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
                     border-radius: 8px; color: #cbd5e1; font-size: 13px; cursor: pointer; font-family: inherit; }
  #caToast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(5,150,105,.96); color: #fff;
             padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 100001; display: none; max-width: 80vw; text-align: center; }
</style>
<div id="caFab" onclick="caOpen()">✉️ 联系管理员</div>
<div id="caMask" onclick="if(event.target===this)caClose()">
  <div id="caBox">
    <h3>✉️ 联系管理员</h3>
    <button type="button" id="caMailBtn" onclick="caCopy()">
      <span id="caMailText">ranliu6953@163.com</span>
      <span id="caCopyTip">点击复制</span>
    </button>
    <div class="ca-note">
      邮件发出后 <b>48 小时内</b>处理。为便于定位，请在邮件中<b>详细说明遇到的问题和触发过程</b>：
      出现在哪个页面、点了哪些按钮、页面提示了什么，如有报错请附上截图。
    </div>
    <button type="button" class="ca-close" onclick="caClose()">关闭</button>
  </div>
</div>
<div id="caToast"></div>
<script>
(function () {
  var EMAIL = 'ranliu6953@163.com';
  function toast(msg) {
    var t = document.getElementById('caToast'); if (!t) return;
    t.innerText = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2000);
  }
  function markCopied() {
    var b = document.getElementById('caMailBtn'), tip = document.getElementById('caCopyTip');
    if (b) { b.classList.add('copied'); setTimeout(function () { b.classList.remove('copied'); }, 2200); }
    if (tip) { tip.innerText = '已复制'; setTimeout(function () { tip.innerText = '点击复制'; }, 2200); }
    toast('邮箱已复制：' + EMAIL);
  }
  window.caOpen = function () { var m = document.getElementById('caMask'); if (m) m.style.display = 'flex'; };
  window.caClose = function () { var m = document.getElementById('caMask'); if (m) m.style.display = 'none'; };
  window.caCopy = function () {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = EMAIL; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, EMAIL.length);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { markCopied(); return; }
      var el = document.getElementById('caMailText');
      if (el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast('复制失败，请长按选中的邮箱手动复制');
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(EMAIL).then(markCopied).catch(fallback);
    } else { fallback(); }
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') caClose(); });
})();
</script>
